name: wedding-site
recipe: laravel
config:
  php: '8.5'
  composer_version: 2-latest
  via: nginx:1.17
  webroot: public
  database: mysql:8.0
  cache: redis
  xdebug: true
services:
  mailhog:
    type: mailhog
    portforward: true
  appserver:
    overrides:
      extra_hosts:
        - "minio.test:host-gateway"
        - "wedding-site.minio.test:host-gateway"
tooling:
  xdebug-test:
    service: appserver
    cmd: php artisan test
    env:
      XDEBUG_MODE: coverage
